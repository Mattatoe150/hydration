<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hydration Map · Moderation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E"/>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fa;color:#1c2330}
  header{background:#1e88e5;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;flex:1}
  header input{padding:7px 9px;border:0;border-radius:8px;font-size:13px;width:190px}
  header button{padding:7px 12px;border:0;border-radius:8px;font-weight:600;cursor:pointer;background:#0d47a1;color:#fff}
  main{max-width:820px;margin:20px auto;padding:0 16px}
  .msg{color:#5b6675;font-size:13px;margin:6px 2px 14px}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(20,30,50,.08);padding:14px 16px;margin-bottom:12px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff}
  .t-add{background:#2e9e3f}.t-report{background:#e0862a}
  .cat{font-size:11px;font-weight:600;color:#5b6675}
  .when{margin-left:auto;font-size:11px;color:#98a2b3}
  .name{font-weight:700;margin:5px 0 2px;font-size:15px}
  .detail{font-size:13px;color:#3a4658;line-height:1.5}
  .reason{color:#c0392b;font-weight:600}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts a{font-size:12px;color:#1e88e5;align-self:center;margin-left:auto}
  .acts button{padding:7px 13px;border:0;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer}
  .approve{background:#2e9e3f;color:#fff}.reject{background:#eef2f7;color:#1c2330}.del{background:#fbe9e9;color:#c0392b}
  .empty{text-align:center;color:#98a2b3;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>✅ Hydration Map — moderation</h1>
  <input id="token" type="password" placeholder="admin token" autocomplete="off"/>
  <button id="load">Load pending</button>
</header>
<main>
  <div class="msg" id="msg">Enter your admin token and click “Load pending”. The token is stored only in this browser.<br><b>Approve</b> certifies a spot · <b>✎ Add to OSM</b> pushes it upstream into OpenStreetMap (then <b>Delete</b> the pending pin — it'll come back from OSM on the next data refresh).</div>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const tokenEl = $('#token'), listEl = $('#list'), msgEl = $('#msg');
tokenEl.value = localStorage.getItem('hm_admin_token') || '';

$('#load').addEventListener('click', load);
async function load(){
  const token = tokenEl.value.trim();
  if(!token){ msgEl.textContent='Please enter your admin token.'; return; }
  localStorage.setItem('hm_admin_token', token);
  msgEl.textContent = 'Loading…';
  let rows;
  try{
    const r = await fetch('/api/moderate', {headers:{'x-admin-token':token}});
    if(r.status===401){ msgEl.textContent='❌ Wrong token.'; return; }
    if(!r.ok) throw new Error(await r.text());
    rows = await r.json();
  }catch(e){ msgEl.textContent='Error: '+e.message+' (is the backend deployed with D1 + ADMIN_TOKEN?)'; return; }
  render(rows);
}

const CATLABEL = {water:'💧 water',vdrinks:'🥤 drinks vending',vsnacks:'🍫 snacks vending',shop:'🏪 shop',fuel:'⛽ fuel-station shop'};
const REASONLABEL = {no_shop:'No shop here (pumps only)',gone:"Doesn't exist anymore",moved:'Wrong location',closed_wrong:'Opening hours wrong',other:'Other'};

function render(rows){
  if(!rows.length){ msgEl.textContent=''; listEl.innerHTML='<div class="empty">🎉 Nothing pending.</div>'; return; }
  msgEl.textContent = `${rows.length} pending.`;
  listEl.innerHTML = '';
  rows.forEach(r=>{
    const el = document.createElement('div'); el.className='card';
    const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    el.innerHTML =
      `<div class="top">
         <span class="tag ${r.kind==='report'?'t-report':'t-add'}">${r.kind==='report'?'REPORT':'ADD'}</span>
         <span class="cat">${CATLABEL[r.cat]||r.cat||''}</span>
         <span class="when">${new Date(r.created).toLocaleString('en-GB')}</span>
       </div>
       <div class="name">${esc(r.name)||'(no name)'}</div>
       ${r.kind==='report'?`<div class="detail reason">⚑ ${REASONLABEL[r.reason]||r.reason}</div>`:''}
       ${r.note?`<div class="detail">${esc(r.note)}</div>`:''}
       <div class="detail">📍 ${r.lat}, ${r.lon}</div>
       <div class="acts">
         <button class="approve">${r.kind==='report'?'Accept':'Approve'}</button>
         <button class="reject">Reject</button>
         <button class="del">Delete</button>
         ${r.kind==='add'
           ? `<a href="https://www.openstreetmap.org/edit#map=19/${r.lat}/${r.lon}" target="_blank" rel="noopener">✎ Add to OSM ↗</a>`
           : `<a href="https://www.openstreetmap.org/#map=19/${r.lat}/${r.lon}" target="_blank" rel="noopener">view on OSM ↗</a>`}
       </div>`;
    el.querySelector('.approve').onclick = ()=> act(r.id,'approve',el);
    el.querySelector('.reject').onclick  = ()=> act(r.id,'reject',el);
    el.querySelector('.del').onclick     = ()=> act(r.id,'delete',el);
    listEl.appendChild(el);
  });
}

async function act(id, action, el){
  const token = tokenEl.value.trim();
  el.style.opacity=.5;
  try{
    const r = await fetch('/api/moderate',{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:JSON.stringify({id,action})});
    if(!r.ok) throw new Error(await r.text());
    el.remove();
    const left = listEl.querySelectorAll('.card').length;
    msgEl.textContent = left ? `${left} pending.` : '';
    if(!left) listEl.innerHTML='<div class="empty">🎉 Nothing pending.</div>';
  }catch(e){ el.style.opacity=1; alert('Failed: '+e.message); }
}
</script>
</body>
</html>
