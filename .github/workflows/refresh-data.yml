name: Refresh OSM data

# Rebuilds the shared POI payload and pages once a day so the base map stays current.
# Runs at 04:17 UTC daily; also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild map data and pages from OpenStreetMap
        run: python3 tools/refresh_data.py

      - name: Verify the generated pages and Functions
        run: npm run check

      - name: Commit if the data changed
        run: |
          git diff --check
          if git diff --quiet -- data/pois.js index.html nl/index.html sitemap.xml; then
            echo "No data changes today."
          else
            git config user.name  "hydration-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pois.js index.html nl/index.html sitemap.xml
            git commit -m "Daily OSM data refresh [skip ci]"
            git push
          fi

      # This project does not currently auto-build Git pushes. Keep the explicit
      # upload so a successful daily commit cannot silently remain undeployed.
      - name: Deploy the verified tree to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy .
          --project-name hydration
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
          --commit-dirty=false
