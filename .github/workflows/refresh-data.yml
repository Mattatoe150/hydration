name: Refresh OSM data

# Rebuilds index.html from OpenStreetMap once a day so the base map stays current.
# Runs at 04:17 UTC daily; also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild index.html from OpenStreetMap
        run: python3 tools/refresh_data.py

      - name: Verify the generated pages and Functions
        run: npm run check

      - name: Commit if the data changed
        run: |
          git diff --check
          if git diff --quiet -- index.html nl/index.html sitemap.xml; then
            echo "No data changes today."
          else
            git config user.name  "hydration-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html nl/index.html sitemap.xml
            git commit -m "Daily OSM data refresh [skip ci]"
            git push
          fi
