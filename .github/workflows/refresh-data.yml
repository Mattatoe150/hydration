name: Refresh OSM data

# Rebuilds index.html from OpenStreetMap once a day so the base map stays current.
# Runs at 04:17 UTC daily; also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Optional: set these repo secrets to auto-deploy to Cloudflare Pages.
      # Leave them unset if your Pages project deploys from Git on push.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild index.html from OpenStreetMap
        run: python3 tools/refresh_data.py

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No data changes today."
          else
            git config user.name  "hydration-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Daily OSM data refresh [skip ci]"
            git push
          fi

      - name: Deploy to Cloudflare Pages (optional)
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy . --project-name hydration --commit-dirty=true
