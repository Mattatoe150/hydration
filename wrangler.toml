# Cloudflare Pages + Functions + D1 configuration.
# See docs/DEPLOY.md for the full deploy walkthrough.

name = "hydration"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# D1 database binding used by functions/api/suggestions.js as `env.DB`.
# Create the database first (`npx wrangler d1 create hydration`) and paste the
# printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "hydration"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
